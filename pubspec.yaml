name: comet
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  emoji_picker_flutter: ^4.4.0
  swipe_to: ^1.0.0
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.0
  audioplayers: ^6.0.0
  file_picker: ^8.1.2
  image_picker: ^1.2.1
  video_player: ^2.8.2
  get: ^4.6.6
  flutter_secure_storage: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.3.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.2.2
  pinput: ^6.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.9.2
  retrofit_generator: ^10.2.3
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/man.jpg
    - assets/earth.jpg
    - assets/logo.png
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#ffffff"
  image: "assets/earth.jpg"
